name: Surge Bridge MVP

on:
  push:
    branches:
      - feat/surge-bridge-mvp
    paths:
      - 'hub/route/surge_bridge*'
      - 'hub/route/server.go'
      - '.github/workflows/surge-bridge.yml'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Diagnostic endpoint tests
        run: go test ./hub/route -run '^TestBridge' -count=1
      - name: Build macOS Apple Silicon binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/surge-bridge-darwin-arm64 .
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: surge-bridge-macos-arm64
          path: dist/surge-bridge-darwin-arm64
          if-no-files-found: error
